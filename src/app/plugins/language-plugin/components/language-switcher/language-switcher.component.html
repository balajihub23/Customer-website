<ng-container *ngIf="displayMode === 'bottom-sheet'">
  <div class="sheet-backdrop" *ngIf="isOpen" (click)="close()">
    <div class="sheet-content card-elevation" (click)="$event.stopPropagation()">
      <div class="sheet-header">
        <div class="sheet-handle"></div>
        <h4 class="sheet-title">{{ 'Select Language' | translate }}</h4>
        <button class="btn-close" (click)="close()" type="button" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M1 1L13 13M1 13L13 1"/>
          </svg>
        </button>
      </div>

      <div class="sheet-body">
        <div 
          *ngFor="let lang of supportedLanguages" 
          class="lang-option-card"
          [class.active]="(currentLanguage$ | async) === lang.code"
          (click)="selectLanguage(lang.code)"
        >
          <div class="lang-info">
            <span class="lang-native">{{ lang.nativeName }}</span>
            <span class="lang-name">{{ lang.name }}</span>
          </div>

          <div class="check-icon" *ngIf="(currentLanguage$ | async) === lang.code">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" fill="#FFC107" />
              <path d="M8 12.5L10.5 15L16 9.5" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="displayMode === 'inline'">
  <div class="inline-lang-container">
    <div 
      *ngFor="let lang of supportedLanguages" 
      class="lang-option-card inline"
      [class.active]="(currentLanguage$ | async) === lang.code"
      (click)="selectLanguage(lang.code)"
    >
      <div class="lang-info">
        <span class="lang-native">{{ lang.nativeName }}</span>
        <span class="lang-name">{{ lang.name }}</span>
      </div>
      <div class="check-icon" *ngIf="(currentLanguage$ | async) === lang.code">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#FFC107" />
          <path d="M8 12.5L10.5 15L16 9.5" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>
</ng-container>
