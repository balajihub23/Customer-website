<header class="customer-header">
  <div class="header-top">
    <!-- Location Pill Selector -->
    <div class="location-box" (click)="handleLocationClick()">
      <div class="location-icon-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
      </div>
      <div class="location-info">
        <span class="location-label">LOCATION</span>
        <span class="location-text">{{ displayLocation }} ▾</span>
      </div>
    </div>
    
    <!-- Action Controls -->
    <div class="header-actions">
      <!-- Dark/Light Mode Toggle -->
      <button class="theme-toggle-btn" (click)="toggleTheme()" [title]="'Current theme: ' + themeService.activeTheme()">
        @if (themeService.activeTheme() === 'DARK') {
          <span>🌙</span>
        } @else {
          <span>☀️</span>
        }
      </button>

      <!-- Notifications Bell -->
      <button type="button" class="notification-badge-btn" (click)="toggleNotifications()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        @if (notificationService.unreadCount() > 0) {
          <span class="badge-count">{{ notificationService.unreadCount() }}</span>
        }
      </button>

      <!-- Logout Button -->
      <button class="logout-btn" (click)="onLogout()" title="Logout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Dynamic Time-Based User Greeting -->
  <div class="header-bottom">
    <div class="user-greeting">
      <h2>{{ greetingTime }}, {{ displayName }}! 👋</h2>
      <p class="subtitle">What service do you need today?</p>
    </div>
  </div>
</header>

<!-- Notifications Screen Modal (Exact Replica of Attached Screenshot 2) -->
<div *ngIf="showNotificationsModal" class="notifications-modal-overlay" (click)="showNotificationsModal = false">
  <div class="notifications-full-dialog" (click)="$event.stopPropagation()">
    
    <!-- Top Bar matching Screenshot 2 -->
    <div class="notif-dialog-header">
      <button class="btn-back-icon" (click)="showNotificationsModal = false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <h3 class="notif-header-title">Notifications</h3>
      <button class="mark-read-btn" (click)="markAllAsRead()">Mark all read</button>
    </div>

    <!-- Unread Subtitle Count -->
    <div class="unread-subtitle-bar">
      <span>{{ notificationService.unreadCount() }} unread notifications</span>
    </div>

    <!-- Notification Cards List matching Screenshot 2 -->
    <div class="notifications-cards-list">
      <div 
        *ngFor="let notif of notificationService.notifications()" 
        class="notif-card" 
        [class.unread]="notif.isUnread">
        
        <!-- Icon Circle -->
        <div class="notif-icon-circle" [ngClass]="notif.type">
          <span *ngIf="notif.type === 'confirmed'">✓</span>
          <span *ngIf="notif.type === 'offer'">🎁</span>
          <span *ngIf="notif.type === 'delay'">!</span>
          <span *ngIf="notif.type === 'info'">ℹ</span>
        </div>

        <!-- Content Details -->
        <div class="notif-card-body">
          <div class="notif-title-row">
            <h4 class="notif-card-title">{{ notif.title }}</h4>
            <span *ngIf="notif.isUnread" class="unread-yellow-dot">●</span>
          </div>
          <p class="notif-card-msg">{{ notif.message }}</p>
          <span class="notif-card-time">{{ notif.time }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<app-logout-modal
  [isOpen]="showLogoutModal"
  (onConfirm)="confirmLogout()"
  (onCancel)="cancelLogout()">
</app-logout-modal>
